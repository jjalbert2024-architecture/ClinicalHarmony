services:

  # ---------------------------------------------------------------------
  # Data Platform
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: clinicalharmony-postgres
    environment:
      POSTGRES_DB: clinicalharmony
      POSTGRES_USER: clinicalharmony
      POSTGRES_PASSWORD: clinicalharmony
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Numbered scripts run in lexical order on first container start only.
      - ./docs/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicalharmony -d clinicalharmony"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinicalharmony-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: clinicalharmony-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinicalharmony-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: clinicalharmony-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - clinicalharmony-net

  # ---------------------------------------------------------------------
  # Identity: Keycloak (SMART on FHIR backend-services auth for fhir-compliance-service)
  #
  # Dev mode with its built-in dev database: the realm (client, SMART scopes, audience mapper)
  # is re-imported from ./keycloak on every fresh start, so `docker-compose up` is fully configured
  # with nothing to click through. Host port 8180 (8080 = api-gateway, 8083 = rules-engine).
  # KC_HOSTNAME pins the token issuer to http://localhost:8180/realms/clinicalharmony whether a
  # token is requested from the host or from inside the compose network.
  # ---------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: clinicalharmony-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl/wget; use bash's /dev/tcp against the management port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clinicalharmony-net

  # ---------------------------------------------------------------------
  # Application services (placeholders — implemented in later phases)
  #
  # Each entry currently boots a bare runtime and idles so that
  # `docker-compose up` succeeds end-to-end from day one. Once a
  # service's Dockerfile is added under its module directory, swap the
  # `image` + `command` lines below for a `build:` block.
  # ---------------------------------------------------------------------

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-ingestion-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      HL7_MLLP_PORT: 8887
      HL7_DEFAULT_SOURCE_SYSTEM: UNKNOWN_HL7_SOURCE
      FHIR_DEFAULT_SOURCE_SYSTEM: UNKNOWN_FHIR_SOURCE
      CLAIMS_DEFAULT_SOURCE_SYSTEM: UNKNOWN_CLAIMS_SOURCE
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"  # REST intake + actuator health
      - "8887:8887"  # HL7 v2 MLLP intake
    networks:
      - clinicalharmony-net

  ontology-service:
    build:
      context: ./ontology-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-ontology-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - clinicalharmony-net

  fhir-compliance-service:
    build:
      context: ./fhir-compliance-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-fhir-compliance-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      # Tokens carry the external issuer (KC_HOSTNAME); signing keys are fetched over the
      # compose network.
      OAUTH_ISSUER_URI: http://localhost:8180/realms/clinicalharmony
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - clinicalharmony-net

  patient-index-service:
    build:
      context: ./patient-index-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-patient-index-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      # Inbound Bearer tokens: same issuer/JWKS split as fhir-compliance-service.
      OAUTH_ISSUER_URI: http://localhost:8180/realms/clinicalharmony
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/certs
      # Outbound: every Gold change goes through GoldWriter, with this service's own client token.
      GOLD_WRITER_BASE_URL: http://fhir-compliance-service:8084
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/token
      PMI_CLIENT_ID: patient-index-service
      PMI_CLIENT_SECRET: patient-index-service-secret  # DEV-ONLY, from keycloak/realm-clinicalharmony.json
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      fhir-compliance-service:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - clinicalharmony-net

  rules-engine-service:
    build:
      context: ./rules-engine-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-rules-engine-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      ONTOLOGY_SERVICE_HOST: ontology-service
      ONTOLOGY_SERVICE_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      ontology-service:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - clinicalharmony-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: clinicalharmony-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      # Least-privilege, read-only login from docs/db-init/22 — the gateway never writes.
      DB_USER: clinicalharmony_gateway_ro
      DB_PASSWORD: gateway-ro-dev-password  # DEV-ONLY
      # Inbound: USER tokens from the dashboard clients (audience clinicalharmony-gateway).
      OAUTH_ISSUER_URI: http://localhost:8180/realms/clinicalharmony
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/certs
      # Outbound: the gateway's own client for calling the services.
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/token
      GATEWAY_CLIENT_ID: api-gateway
      GATEWAY_CLIENT_SECRET: api-gateway-secret  # DEV-ONLY, from keycloak/realm-clinicalharmony.json
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      INGESTION_BASE_URL: http://ingestion-service:8081
      ONTOLOGY_BASE_URL: http://ontology-service:8082
      RULES_ENGINE_BASE_URL: http://rules-engine-service:8083
      FHIR_COMPLIANCE_BASE_URL: http://fhir-compliance-service:8084
      PATIENT_INDEX_BASE_URL: http://patient-index-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Started, not healthy: a downstream that's down is a 503 for its actions, not a gateway that won't boot.
      ingestion-service:
        condition: service_started
      ontology-service:
        condition: service_started
      rules-engine-service:
        condition: service_started
      fhir-compliance-service:
        condition: service_started
      patient-index-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - clinicalharmony-net

  # Phase 8: React SPA, built with node:24-alpine and served as static files by nginx:1.30.6-alpine.
  # The BROWSER calls the gateway and Keycloak directly — both URLs are as the browser sees them
  # (localhost), not compose service names. nginx proxies nothing; CORS is the gateway's
  # (CORS_ALLOWED_ORIGINS above), and these two URLs also feed the page's Content-Security-Policy.
  dashboard-ui:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
    container_name: clinicalharmony-dashboard-ui
    environment:
      GATEWAY_URL: http://localhost:8080
      KEYCLOAK_URL: http://localhost:8180
    depends_on:
      # Started, not healthy: the SPA shows "gateway unreachable" with a retry rather than failing to serve.
      api-gateway:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - clinicalharmony-net

networks:
  clinicalharmony-net:
    driver: bridge

volumes:
  postgres-data:
