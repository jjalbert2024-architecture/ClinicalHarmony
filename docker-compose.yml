services:

  # ---------------------------------------------------------------------
  # Data Platform
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: clinicalharmony-postgres
    environment:
      POSTGRES_DB: clinicalharmony
      POSTGRES_USER: clinicalharmony
      POSTGRES_PASSWORD: clinicalharmony
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Numbered scripts run in lexical order on first container start only.
      - ./docs/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicalharmony -d clinicalharmony"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinicalharmony-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: clinicalharmony-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinicalharmony-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: clinicalharmony-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - clinicalharmony-net

  # ---------------------------------------------------------------------
  # Application services (placeholders — implemented in later phases)
  #
  # Each entry currently boots a bare runtime and idles so that
  # `docker-compose up` succeeds end-to-end from day one. Once a
  # service's Dockerfile is added under its module directory, swap the
  # `image` + `command` lines below for a `build:` block.
  # ---------------------------------------------------------------------

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-ingestion-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      HL7_MLLP_PORT: 8887
      HL7_DEFAULT_SOURCE_SYSTEM: UNKNOWN_HL7_SOURCE
      FHIR_DEFAULT_SOURCE_SYSTEM: UNKNOWN_FHIR_SOURCE
      CLAIMS_DEFAULT_SOURCE_SYSTEM: UNKNOWN_CLAIMS_SOURCE
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"  # REST intake + actuator health
      - "8887:8887"  # HL7 v2 MLLP intake
    networks:
      - clinicalharmony-net

  ontology-service:
    build:
      context: ./ontology-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-ontology-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - clinicalharmony-net

  fhir-compliance-service:
    image: eclipse-temurin:17-jre
    container_name: clinicalharmony-fhir-compliance-service
    command: ["sh", "-c", "echo '[placeholder] fhir-compliance-service — Phase 5' && sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - clinicalharmony-net

  patient-index-service:
    image: eclipse-temurin:17-jre
    container_name: clinicalharmony-patient-index-service
    command: ["sh", "-c", "echo '[placeholder] patient-index-service — Phase 6' && sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - clinicalharmony-net

  rules-engine-service:
    build:
      context: ./rules-engine-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-rules-engine-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      ONTOLOGY_SERVICE_HOST: ontology-service
      ONTOLOGY_SERVICE_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      ontology-service:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - clinicalharmony-net

  api-gateway:
    image: eclipse-temurin:17-jre
    container_name: clinicalharmony-api-gateway
    command: ["sh", "-c", "echo '[placeholder] api-gateway — Phase 7' && sleep infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - clinicalharmony-net

  dashboard-ui:
    image: node:20-alpine
    container_name: clinicalharmony-dashboard-ui
    command: ["sh", "-c", "echo '[placeholder] dashboard-ui — Phase 8' && sleep infinity"]
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    networks:
      - clinicalharmony-net

networks:
  clinicalharmony-net:
    driver: bridge

volumes:
  postgres-data:
