# Phase 9e: every application service logs one JSON object per line; Docker's built-in splunk log driver sends
# stdout to Splunk's HTTP Event Collector (published on the Docker host's localhost:8088, which is where the Docker
# daemon itself connects from). Non-blocking with a buffer, so a service starts and runs even while Splunk is down
# or still booting; `docker logs` keeps working (Docker's dual logging). DEV-ONLY HEC token.
x-splunk-logging: &splunk-logging
  driver: splunk
  options:
    splunk-url: https://localhost:8088
    splunk-token: 9e0c1a7c-0000-4c1f-9e00-c11a1c4a7d0e
    splunk-index: clinicalharmony
    splunk-sourcetype: clinicalharmony:json
    splunk-format: raw
    splunk-insecureskipverify: "true"
    splunk-verify-connection: "false"
    mode: non-blocking
    max-buffer-size: 4m
    tag: "{{.Name}}"

# Phase 9e: Micrometer meters → OTLP → otel-collector → Splunk metrics index.
x-otlp-env: &otlp-env
  OTLP_METRICS_ENABLED: "true"
  OTLP_METRICS_URL: http://otel-collector:4318/v1/metrics

services:

  # ---------------------------------------------------------------------
  # Data Platform
  # ---------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: clinicalharmony-postgres
    environment:
      POSTGRES_DB: clinicalharmony
      POSTGRES_USER: clinicalharmony
      POSTGRES_PASSWORD: clinicalharmony
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Numbered scripts run in lexical order on first container start only.
      - ./docs/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicalharmony -d clinicalharmony"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clinicalharmony-net

  # Phase 9a: single-node Kafka in KRaft mode (no Zookeeper) — the same cp-kafka 7.6.1 image the
  # Testcontainers tests run. Host port 19092 (an unrelated project grabs 9092/2181 on Docker
  # restart); containers use kafka:29092. Topics are declared by the services that own them
  # (3 partitions each), so broker auto-create is off and a typo'd topic name fails loudly.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: clinicalharmony-kafka
    environment:
      CLUSTER_ID: Q2xpbmljYWxIYXJtb255MQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - clinicalharmony-net

  # Phase 9a: Kafbat UI (Apache-2.0 fork of provectuslabs/kafka-ui) to watch topics, messages,
  # consumer lag and dead letters in dev. Read-only, no auth: never expose it beyond localhost.
  kafbat-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: clinicalharmony-kafbat-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: clinicalharmony
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    networks:
      - clinicalharmony-net

  # ---------------------------------------------------------------------
  # Identity: Keycloak (SMART on FHIR backend-services auth for fhir-compliance-service)
  #
  # Dev mode with its built-in dev database: the realm (client, SMART scopes, audience mapper)
  # is re-imported from ./keycloak on every fresh start, so `docker-compose up` is fully configured
  # with nothing to click through. Host port 8180 (8080 = api-gateway, 8083 = rules-engine).
  # KC_HOSTNAME pins the token issuer to http://localhost:8180/realms/clinicalharmony whether a
  # token is requested from the host or from inside the compose network.
  # ---------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: clinicalharmony-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl/wget; use bash's /dev/tcp against the management port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - clinicalharmony-net

  # ---------------------------------------------------------------------
  # Application services (placeholders — implemented in later phases)
  #
  # Each entry currently boots a bare runtime and idles so that
  # `docker-compose up` succeeds end-to-end from day one. Once a
  # service's Dockerfile is added under its module directory, swap the
  # `image` + `command` lines below for a `build:` block.
  # ---------------------------------------------------------------------

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-ingestion-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      HL7_MLLP_PORT: 8887
      HL7_DEFAULT_SOURCE_SYSTEM: UNKNOWN_HL7_SOURCE
      FHIR_DEFAULT_SOURCE_SYSTEM: UNKNOWN_FHIR_SOURCE
      CLAIMS_DEFAULT_SOURCE_SYSTEM: UNKNOWN_CLAIMS_SOURCE
      CCDA_DEFAULT_SOURCE_SYSTEM: UNKNOWN_CCDA_SOURCE
      # MLLP (9a) and REST (9d) both publish to Kafka (answer only after acks=all); no database since 9d.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"  # REST intake + actuator health
      - "8887:8887"  # HL7 v2 MLLP intake
    networks:
      - clinicalharmony-net

  # Phase 9a: consumer group bronze-writer — clinicalharmony.bronze.hl7v2.raw → bronze.raw_messages
  # (+ outbox) → clinicalharmony.bronze.ingested. Health/metrics only, no business REST API.
  bronze-listener-service:
    build:
      context: ./bronze-listener-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-bronze-listener-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    networks:
      - clinicalharmony-net

  # Phase 9b: clinicalharmony.bronze.ingested → silver.* → clinicalharmony.silver.patient.changed.
  # No depends_on rules-engine-service on purpose: if it's down, Silver is still written and the
  # patient stays PENDING_VALIDATION until the sweeper can validate it.
  silver-transformer-service:
    build:
      context: ./silver-transformer-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-silver-transformer-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RULES_ENGINE_BASE_URL: http://rules-engine-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8087:8087"
    networks:
      - clinicalharmony-net

  ontology-service:
    build:
      context: ./ontology-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-ontology-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - clinicalharmony-net

  fhir-compliance-service:
    build:
      context: ./fhir-compliance-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-fhir-compliance-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      # Tokens carry the external issuer (KC_HOSTNAME); signing keys are fetched over the
      # compose network.
      OAUTH_ISSUER_URI: http://localhost:8180/realms/clinicalharmony
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/certs
      # Phase 9c gold-builder: clinicalharmony.silver.patient.changed → Gold → clinicalharmony.gold.patient.changed
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - clinicalharmony-net

  patient-index-service:
    build:
      context: ./patient-index-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-patient-index-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      # Inbound Bearer tokens: same issuer/JWKS split as fhir-compliance-service.
      OAUTH_ISSUER_URI: http://localhost:8180/realms/clinicalharmony
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/certs
      # Outbound: every Gold change goes through GoldWriter, with this service's own client token.
      GOLD_WRITER_BASE_URL: http://fhir-compliance-service:8084
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/token
      PMI_CLIENT_ID: patient-index-service
      PMI_CLIENT_SECRET: patient-index-service-secret  # DEV-ONLY, from keycloak/realm-clinicalharmony.json
      # Phase 9c pmi-matcher: clinicalharmony.gold.patient.changed → one debounced matching run per burst
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fhir-compliance-service:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - clinicalharmony-net

  rules-engine-service:
    build:
      context: ./rules-engine-service
      dockerfile: Dockerfile
    container_name: clinicalharmony-rules-engine-service
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      DB_USER: clinicalharmony
      DB_PASSWORD: clinicalharmony
      ONTOLOGY_SERVICE_HOST: ontology-service
      ONTOLOGY_SERVICE_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      ontology-service:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - clinicalharmony-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: clinicalharmony-api-gateway
    logging: *splunk-logging
    environment:
      <<: *otlp-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinicalharmony
      # Least-privilege, read-only login from docs/db-init/22 — the gateway never writes.
      DB_USER: clinicalharmony_gateway_ro
      DB_PASSWORD: gateway-ro-dev-password  # DEV-ONLY
      # Inbound: USER tokens from the dashboard clients (audience clinicalharmony-gateway).
      OAUTH_ISSUER_URI: http://localhost:8180/realms/clinicalharmony
      OAUTH_JWK_SET_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/certs
      # Outbound: the gateway's own client for calling the services.
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/clinicalharmony/protocol/openid-connect/token
      GATEWAY_CLIENT_ID: api-gateway
      GATEWAY_CLIENT_SECRET: api-gateway-secret  # DEV-ONLY, from keycloak/realm-clinicalharmony.json
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SPLUNK_WEB_URL: http://localhost:8000   # as the BROWSER sees it: the Bronze page's "Open trace in Splunk"
      INGESTION_BASE_URL: http://ingestion-service:8081
      ONTOLOGY_BASE_URL: http://ontology-service:8082
      RULES_ENGINE_BASE_URL: http://rules-engine-service:8083
      FHIR_COMPLIANCE_BASE_URL: http://fhir-compliance-service:8084
      PATIENT_INDEX_BASE_URL: http://patient-index-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Started, not healthy: a downstream that's down is a 503 for its actions, not a gateway that won't boot.
      ingestion-service:
        condition: service_started
      ontology-service:
        condition: service_started
      rules-engine-service:
        condition: service_started
      fhir-compliance-service:
        condition: service_started
      patient-index-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - clinicalharmony-net

  # Phase 8: React SPA, built with node:24-alpine and served as static files by nginx:1.30.6-alpine.
  # The BROWSER calls the gateway and Keycloak directly — both URLs are as the browser sees them
  # (localhost), not compose service names. nginx proxies nothing; CORS is the gateway's
  # (CORS_ALLOWED_ORIGINS above), and these two URLs also feed the page's Content-Security-Policy.
  dashboard-ui:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
    container_name: clinicalharmony-dashboard-ui
    environment:
      GATEWAY_URL: http://localhost:8080
      KEYCLOAK_URL: http://localhost:8180
    depends_on:
      # Started, not healthy: the SPA shows "gateway unreachable" with a retry rather than failing to serve.
      api-gateway:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - clinicalharmony-net

  # ---------------------------------------------------------------------
  # Observability (Phase 9e)
  # ---------------------------------------------------------------------

  # Splunk Enterprise 10.4.5 (amd64 only: runs under x86 emulation on Apple Silicon — turn on Rosetta in Docker
  # Desktop). Web UI localhost:8000 (admin / the DEV-ONLY password below), HEC 8088, management API 8089. The
  # clinicalharmony app (indexes, HEC token, JSON field extraction, dashboards, alerts) is mounted from the repo. Trial
  # license (60 days, with alerting); recreate the container to start a new trial.
  splunk:
    image: splunk/splunk:10.4.5
    platform: linux/amd64
    container_name: clinicalharmony-splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: clinicalharmony-splunk-dev   # DEV-ONLY
    volumes:
      # Read-write: the image's provisioning chowns everything under /opt/splunk (a :ro mount fails it). Splunk only
      # writes local/ and metadata/local.meta here (UI edits), which are git-ignored.
      - ./observability/splunk/apps/clinicalharmony:/opt/splunk/etc/apps/clinicalharmony
      - splunk-var:/opt/splunk/var
    ports:
      - "8000:8000"   # Splunk Web
      - "8088:8088"   # HTTP Event Collector
      - "8089:8089"   # management REST API (smoke test)
    networks:
      - clinicalharmony-net

  # OpenTelemetry Collector (contrib 0.164.0): the services' OTLP metrics, Kafka consumer lag and service health
  # checks → Splunk HEC (clinicalharmony_metrics). Config: observability/otel-collector/config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: clinicalharmony-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      SPLUNK_HEC_TOKEN: 9e0c1a7c-0000-4c1f-9e00-c11a1c4a7d0e   # DEV-ONLY
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4318:4318"     # OTLP/HTTP (services, or a host-run service with OTLP_METRICS_URL=http://localhost:4318/v1/metrics)
      - "13133:13133"   # collector health
    networks:
      - clinicalharmony-net

networks:
  clinicalharmony-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  splunk-var:
