server:
  port: 8084
  tomcat:
    # FHIR token search puts '|' in the query string (code=system|code). Tomcat rejects it unencoded
    # by default with a bare HTML 400; allow it so clients that don't percent-encode it still work.
    relaxed-query-chars: "|"

gold-writer:
  # Validate Gold rows seeded with compliance_notes.status = PENDING_VALIDATION (migration 19) on startup.
  revalidate-pending-on-startup: true

# Phase 9c: clinicalharmony.silver.patient.changed → Gold (via GoldWriter) → clinicalharmony.gold.patient.changed
gold-builder:
  enabled: ${GOLD_BUILDER_ENABLED:true}
  partitions: 3
  retry:
    # Technical failures (DB down…): 3 retries with exponential backoff, then <topic>.dlt.
    max-retries: 3
    initial-interval: 1s
    multiplier: 2.0
  outbox:
    poll-interval: 500ms
    batch-size: 100
    send-timeout: 10s

spring:
  application:
    name: fhir-compliance-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Phase 9c gold-builder (consumer group gold-builder) + the Gold outbox relay.
  kafka:
    consumer:
      group-id: gold-builder
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A build validates every resource with the HL7 validator (tens of ms each): keep polls small so a
      # batch finishes well inside max.poll.interval.ms.
      max-poll-records: 20
    producer:
      # Used by the outbox relay and the dead-letter publisher.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 9000
    listener:
      # Offset committed after EACH record, i.e. only after its Gold transaction has committed.
      ack-mode: record
      # One consumer thread per partition of clinicalharmony.silver.patient.changed.
      concurrency: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must carry this exact `iss` (Keycloak's KC_HOSTNAME) ...
          issuer-uri: ${smart.issuer}
          # ... but signing keys are fetched from wherever Keycloak is reachable from this process
          # (keycloak:8080 inside compose). Fetched lazily on the first token, cached by Nimbus.
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8180/realms/clinicalharmony/protocol/openid-connect/certs}
          audiences: clinicalharmony-fhir

# SMART App Launch discovery (/.well-known/smart-configuration) points clients at this
# authorization server; also the issuer every Bearer token is checked against.
smart:
  issuer: ${OAUTH_ISSUER_URI:http://localhost:8180/realms/clinicalharmony}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # Phase 9e: Micrometer meters → OTLP/HTTP → OpenTelemetry Collector → Splunk (metrics index). Off unless
  # OTLP_METRICS_ENABLED=true (docker-compose sets it), so tests and `mvn spring-boot:run` export nothing.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 15s
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:dev}
  metrics:
    distribution:
      # Latency percentiles exported as gauges (p50 / p95 / p99) for the 9e dashboards.
      percentiles:
        clinicalharmony.gold.end_to_end.latency: 0.5, 0.95, 0.99

# Phase 9e: one JSON object per log line (Logstash layout), like every other service — MDC (requestId = the
# correlation id) and SLF4J key/values (event, masterPatientId, …) become top-level fields in Splunk.
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

---
# Local profile: for running via `mvn spring-boot:run` on the host machine,
# against the Postgres container's published port.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/clinicalharmony
    username: clinicalharmony
    password: clinicalharmony
    hikari:
      schema: ontology
  kafka:
    bootstrap-servers: localhost:19092

---
# Docker profile: activated via SPRING_PROFILES_ACTIVE=docker in docker-compose.yml.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:clinicalharmony}
    username: ${DB_USER:clinicalharmony}
    password: ${DB_PASSWORD:clinicalharmony}
    hikari:
      schema: ontology
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
