server:
  port: 8084
  tomcat:
    # FHIR token search puts '|' in the query string (code=system|code). Tomcat rejects it unencoded
    # by default with a bare HTML 400; allow it so clients that don't percent-encode it still work.
    relaxed-query-chars: "|"

gold-writer:
  # Validate Gold rows seeded with compliance_notes.status = PENDING_VALIDATION (migration 19) on startup.
  revalidate-pending-on-startup: true

spring:
  application:
    name: fhir-compliance-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must carry this exact `iss` (Keycloak's KC_HOSTNAME) ...
          issuer-uri: ${smart.issuer}
          # ... but signing keys are fetched from wherever Keycloak is reachable from this process
          # (keycloak:8080 inside compose). Fetched lazily on the first token, cached by Nimbus.
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8180/realms/clinicalharmony/protocol/openid-connect/certs}
          audiences: clinicalharmony-fhir

# SMART App Launch discovery (/.well-known/smart-configuration) points clients at this
# authorization server; also the issuer every Bearer token is checked against.
smart:
  issuer: ${OAUTH_ISSUER_URI:http://localhost:8180/realms/clinicalharmony}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

---
# Local profile: for running via `mvn spring-boot:run` on the host machine,
# against the Postgres container's published port.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/clinicalharmony
    username: clinicalharmony
    password: clinicalharmony
    hikari:
      schema: ontology

---
# Docker profile: activated via SPRING_PROFILES_ACTIVE=docker in docker-compose.yml.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:clinicalharmony}
    username: ${DB_USER:clinicalharmony}
    password: ${DB_PASSWORD:clinicalharmony}
    hikari:
      schema: ontology
