server:
  port: 8081

spring:
  application:
    name: ingestion-service
  # No datasource since 9d: every intake path (MLLP since 9a, REST since 9d) publishes to
  # clinicalharmony.bronze.<format>.raw and bronze-listener-service writes Bronze. acks=all + idempotent
  # producer; intake blocks on the send (ingestion.kafka.send-timeout) and only then ACKs AA / answers 202.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 9000
        linger.ms: 0

camel:
  springboot:
    name: ingestion-service

ingestion:
  hl7:
    mllp-port: ${HL7_MLLP_PORT:8887}
    default-source-system: ${HL7_DEFAULT_SOURCE_SYSTEM:UNKNOWN_HL7_SOURCE}
  fhir:
    default-source-system: ${FHIR_DEFAULT_SOURCE_SYSTEM:UNKNOWN_FHIR_SOURCE}
  claims:
    default-source-system: ${CLAIMS_DEFAULT_SOURCE_SYSTEM:UNKNOWN_CLAIMS_SOURCE}
  ccda:
    default-source-system: ${CCDA_DEFAULT_SOURCE_SYSTEM:UNKNOWN_CCDA_SOURCE}
  kafka:
    send-timeout: 10s
    partitions: 3
    # One Kafka record per payload: the JSON-wrapped event must stay under the producer's max.request.size
    # (1 MiB default) and the broker's message.max.bytes. Bigger REST payloads get 413.
    max-event-bytes: 1000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # Phase 9e: Micrometer meters → OTLP/HTTP → OpenTelemetry Collector → Splunk (metrics index). Off unless
  # OTLP_METRICS_ENABLED=true (docker-compose sets it), so tests and `mvn spring-boot:run` export nothing.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 15s
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:dev}
  metrics:
    distribution:
      # Latency percentiles exported as gauges (p50 / p95 / p99) for the 9e dashboards.
      percentiles:
        clinicalharmony.hl7.mllp.ack.latency: 0.5, 0.95, 0.99

# Phase 9a: one JSON object per log line (Logstash layout): MDC (correlationId) and SLF4J key/values
# (event, topic, partition, offset, durationMs…) become top-level fields for Datadog / Splunk in 9e.
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
