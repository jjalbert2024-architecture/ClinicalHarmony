# ClinicalHarmony observability app (Phase 9e). Mounted read-only into the Splunk container; everything here is
# configuration as code — indexes, the HEC token, field extraction, dashboards and alerts.
[install]
is_configured = 1

[ui]
is_visible = 1
label = ClinicalHarmony

[launcher]
author = ClinicalHarmony
description = Pipeline throughput, consumer lag, dead letters, quarantine rate, end-to-end latency, service health and trace-by-correlation-id for the ClinicalHarmony medallion pipeline.
version = 1.0.0

[package]
id = clinicalharmony
check_for_updates = 0
