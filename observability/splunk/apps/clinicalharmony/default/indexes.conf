# Logs (one JSON object per line from every service, via Docker's splunk log driver) and metrics (Micrometer →
# OTLP → OpenTelemetry Collector → HEC, plus the collector's own Kafka consumer-lag and health-check metrics).
[clinicalharmony]
homePath   = $SPLUNK_DB/clinicalharmony/db
coldPath   = $SPLUNK_DB/clinicalharmony/colddb
thawedPath = $SPLUNK_DB/clinicalharmony/thaweddb
frozenTimePeriodInSecs = 2592000

[clinicalharmony_metrics]
datatype   = metric
homePath   = $SPLUNK_DB/clinicalharmony_metrics/db
coldPath   = $SPLUNK_DB/clinicalharmony_metrics/colddb
thawedPath = $SPLUNK_DB/clinicalharmony_metrics/thaweddb
frozenTimePeriodInSecs = 2592000
