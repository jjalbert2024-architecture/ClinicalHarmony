# Every service logs one Logstash-layout JSON object per line. The Docker splunk log driver (format raw) prefixes
# the container tag; SEDCMD strips everything before the first "{" so _raw is the JSON line itself.
[clinicalharmony:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
SEDCMD-strip_docker_tag = s/^[^{]*\{/{/
KV_MODE = json
TIME_PREFIX = "@timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 100000
# ontology / rules-engine / fhir-compliance / patient-index / api-gateway keep the correlation id in MDC as
# requestId; the Kafka services as correlationId. One name to search by:
FIELDALIAS-correlation = requestId ASNEW correlationId
