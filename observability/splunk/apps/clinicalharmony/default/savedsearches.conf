# Phase 9e alerts. Each runs every minute and, when it finds something, records a triggered alert in Splunk
# (Activity → Triggered Alerts, and the "Alerts" panel of the pipeline dashboard). Nothing is sent outside the laptop.
# Re-alerting on the same thing is suppressed for 5 minutes.

[ClinicalHarmony - Consumer lag high]
description = A consumer group has been more than 50 messages behind on a topic for the last 3 minutes (every sample, not a spike). Source: the OpenTelemetry Collector's kafkametrics receiver (kafka.consumer_group.lag_sum).
search = | mstats min(kafka.consumer_group.lag_sum) AS min_lag max(kafka.consumer_group.lag_sum) AS max_lag WHERE index=clinicalharmony_metrics BY group, topic | where min_lag > 50 | eval summary=group." is ".max_lag." messages behind on ".topic
dispatch.earliest_time = -3m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 5m
request.ui_dispatch_app = clinicalharmony

[ClinicalHarmony - Dead letters]
description = A record was sent to a dead-letter topic in the last 5 minutes (bronze-writer, silver-transformer, gold-builder or pmi-matcher gave up on it). Source: the services' *.deadlettered log events.
search = index=clinicalharmony event="*.deadlettered" | stats count AS deadLetters latest(topic) AS topic latest(dltTopic) AS dltTopic latest(reason) AS reason latest(correlationId) AS correlationId BY service | eval summary=service." dead-lettered ".deadLetters." record(s) from ".topic
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 5m
request.ui_dispatch_app = clinicalharmony

[ClinicalHarmony - Service down]
description = A service's /actuator/health did not answer (connection refused / DNS) or answered non-2xx in the last 2 minutes. Source: the OpenTelemetry Collector's httpcheck receiver (every 15 s).
search = | mstats sum(httpcheck.error) AS errors WHERE index=clinicalharmony_metrics BY http.url | append [| mstats max(httpcheck.status) AS bad WHERE index=clinicalharmony_metrics AND (http.status_class="4xx" OR http.status_class="5xx") BY http.url] | stats sum(errors) AS errors max(bad) AS unhealthy BY http.url | where errors > 0 OR unhealthy > 0 | rex field=http.url "//(?<service>[^:/]+)" | eval summary=service." is down (".http.url.")"
dispatch.earliest_time = -2m
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 5m
request.ui_dispatch_app = clinicalharmony
