server:
  port: 8085

spring:
  application:
    name: patient-index-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same realm, issuer and audience as fhir-compliance-service.
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8180/realms/clinicalharmony}
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8180/realms/clinicalharmony/protocol/openid-connect/certs}
          audiences: clinicalharmony-fhir

# GoldWriter (fhir-compliance-service) applies every Gold change this service decides on.
gold-writer:
  base-url: ${GOLD_WRITER_BASE_URL:http://localhost:8084}
  connect-timeout: 2s
  read-timeout: 30s
  # This service's own Keycloak client (client_credentials), asking only for pipeline.write.
  token-uri: ${OAUTH_TOKEN_URI:http://localhost:8180/realms/clinicalharmony/protocol/openid-connect/token}
  client-id: ${PMI_CLIENT_ID:patient-index-service}
  client-secret: ${PMI_CLIENT_SECRET:patient-index-service-secret}  # DEV-ONLY default, matches keycloak/realm-clinicalharmony.json
  scope: clinicalharmony/pipeline.write

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/clinicalharmony
    username: clinicalharmony
    password: clinicalharmony
    hikari:
      schema: pmi

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:clinicalharmony}
    username: ${DB_USER:clinicalharmony}
    password: ${DB_PASSWORD:clinicalharmony}
    hikari:
      schema: pmi
