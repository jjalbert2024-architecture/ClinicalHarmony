server:
  port: 8085

spring:
  application:
    name: patient-index-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Phase 9c pmi-matcher (consumer group pmi-matcher). The producer is used only by the dead-letter publisher.
  kafka:
    consumer:
      group-id: pmi-matcher
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    listener:
      ack-mode: record
      concurrency: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same realm, issuer and audience as fhir-compliance-service.
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8180/realms/clinicalharmony}
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8180/realms/clinicalharmony/protocol/openid-connect/certs}
          audiences: clinicalharmony-fhir

# GoldWriter (fhir-compliance-service) applies every Gold change this service decides on.
gold-writer:
  base-url: ${GOLD_WRITER_BASE_URL:http://localhost:8084}
  connect-timeout: 2s
  read-timeout: 30s
  # This service's own Keycloak client (client_credentials), asking only for pipeline.write.
  token-uri: ${OAUTH_TOKEN_URI:http://localhost:8180/realms/clinicalharmony/protocol/openid-connect/token}
  client-id: ${PMI_CLIENT_ID:patient-index-service}
  client-secret: ${PMI_CLIENT_SECRET:patient-index-service-secret}  # DEV-ONLY default, matches keycloak/realm-clinicalharmony.json
  scope: clinicalharmony/pipeline.write

# Phase 9c: clinicalharmony.gold.patient.changed → one debounced matching run per burst.
pmi-matcher:
  enabled: ${PMI_MATCHER_ENABLED:true}
  partitions: 3
  # One run 5 s after the last event of a burst, and at most 30 s after the first pending event.
  quiet-period: 5s
  max-delay: 30s
  tick: 500ms
  # GoldWriter down or the PMI lock busy (manual run / review): try the run again after this.
  retry-delay: 30s
  run-on-startup: true
  retry:
    max-retries: 3
    initial-interval: 1s
    multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    # %kvp: the SLF4J key/values of the Phase 9c log events (event=pmi.run runId=… …).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg %kvp%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/clinicalharmony
    username: clinicalharmony
    password: clinicalharmony
    hikari:
      schema: pmi
  kafka:
    bootstrap-servers: localhost:19092

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:clinicalharmony}
    username: ${DB_USER:clinicalharmony}
    password: ${DB_PASSWORD:clinicalharmony}
    hikari:
      schema: pmi
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
