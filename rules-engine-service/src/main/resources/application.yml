server:
  port: 8083

spring:
  application:
    name: rules-engine-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

---
# Local profile: for running via `mvn spring-boot:run` on the host machine,
# against the Postgres container's published port and ontology-service's
# published port.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/clinicalharmony
    username: clinicalharmony
    password: clinicalharmony
    hikari:
      schema: ontology

ontology-service:
  base-url: http://localhost:8082

---
# Docker profile: activated via SPRING_PROFILES_ACTIVE=docker in docker-compose.yml,
# resolves both the datasource and ontology-service host via Compose service names.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:clinicalharmony}
    username: ${DB_USER:clinicalharmony}
    password: ${DB_PASSWORD:clinicalharmony}
    hikari:
      schema: ontology

ontology-service:
  base-url: http://${ONTOLOGY_SERVICE_HOST:ontology-service}:${ONTOLOGY_SERVICE_PORT:8082}
